name: Feature request
description: Propose a new capability or improvement
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        SkyFeed is intentionally local-first and privacy-conscious. Feature ideas that require Message Content intent, public exposure of receiver coordinates, or cloud-hosted multi-tenant tracking are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for a single-feeder Discord bot?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working (commands, config, alerts, ops).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope fit
      options:
        - label: This stays compatible with no Message Content intent.
          required: true
        - label: This does not require storing or publishing private receiver coordinates.
          required: true
