name: Release image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - id: release
        name: Validate promotion and release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          short_sha=${release_sha:0:7}
          version=$(sh scripts/release-version.sh)
          tag="v${version}"

          verified=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_sha}" --jq .commit.verification.verified)
          test "${verified}" = true

          if [[ "${GITHUB_EVENT_NAME}" == workflow_run ]]; then
            promotion_count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_sha}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "dev" and .head.repo.full_name == "'"${GITHUB_REPOSITORY}"'")] | length')
            if [[ "${promotion_count}" -ne 1 ]]; then
              echo "release commit must come from one merged dev-to-main pull request" >&2
              exit 1
            fi
          fi

          should_release=true
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            existing_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)
            test "${existing_sha}" = "${release_sha}"
            should_release=false
          elif git rev-parse --verify --quiet "refs/tags/${tag}"; then
            existing_sha=$(git rev-list -n 1 "${tag}")
            test "${existing_sha}" = "${release_sha}"
          fi

          {
            printf 'release_sha=%s\n' "${release_sha}"
            printf 'short_sha=%s\n' "${short_sha}"
            printf 'should_release=%s\n' "${should_release}"
            printf 'tag=%s\n' "${tag}"
            printf 'version=%s\n' "${version}"
          } >> "${GITHUB_OUTPUT}"

  image:
    if: needs.verify.outputs.should_release == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.release_sha }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/skyfeed
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=sha-${{ needs.verify.outputs.short_sha }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.tag }}
            COMMIT=${{ needs.verify.outputs.release_sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/skyfeed@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/skyfeed
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/skyfeed
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Publish GitHub prerelease
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          notes_source="docs/releases/${TAG}.md"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          tail -n +5 "${notes_source}" > "${notes_file}"
          printf "\n## Container digest\n\n\`ghcr.io/%s/skyfeed@%s\`\n" "${GITHUB_REPOSITORY_OWNER}" "${DIGEST}" >> "${notes_file}"
          release_flags=(--target "${RELEASE_SHA}" --title "SkyFeed ${VERSION}")
          if [[ "${VERSION}" == 0.* ]]; then
            release_flags+=(--prerelease --title "SkyFeed ${VERSION} preview")
          fi
          gh release create "${TAG}" "${release_flags[@]}" --notes-file "${notes_file}"

  sync-dev:
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped')
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.release_sha }}
      - name: Fast-forward dev to the released main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        run: |
          dev_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)
          git fetch origin "${dev_sha}"
          git merge-base --is-ancestor "${dev_sha}" "${RELEASE_SHA}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/dev" \
            -f sha="${RELEASE_SHA}" -F force=false >/dev/null
