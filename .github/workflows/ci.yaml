name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate dev-to-main promotion
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "${BASE_REF}" = main
          test "${HEAD_REF}" = dev
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          version=$(sh scripts/release-version.sh)
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/v${version}"; then
            echo "v${version} already exists; bump VERSION and update the changelog/release notes" >&2
            exit 1
          fi

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: sh scripts/release-version.sh
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go tool govulncheck ./...
      - run: go tool go-licenses check ./cmd/skyfeed
      - run: go tool go-licenses report ./cmd/skyfeed | tee dependency-licenses.csv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-licenses
          path: dependency-licenses.csv
      - name: Scan committed history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner
      - run: go test -run=^$ -bench=. -benchmem ./internal/state ./internal/rules
      - run: go test -run=^$ -fuzz=FuzzParseCustomID -fuzztime=10s ./internal/discord
      - run: go test -run=^$ -fuzz=FuzzCommandFilters -fuzztime=10s ./internal/discord
      - run: go test -run=^$ -fuzz=FuzzDurationParsing -fuzztime=10s ./internal/config
      - run: go test -run=^$ -fuzz=FuzzAircraftJSONDecoder -fuzztime=10s ./internal/source/readsb
      - run: go test -run=^$ -fuzz=FuzzADSBDBDecoder -fuzztime=10s ./internal/enrichment/adsbdb

  flake-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix flake check -L

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SKYFEED_DISCORD_APPLICATION_ID: "1"
      SKYFEED_DISCORD_GUILD_ID: "2"
      SKYFEED_ADSB_BASE_URL: http://192.0.2.1/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml config --quiet
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: skyfeed:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm skyfeed:ci version
      - run: test "$(docker image inspect skyfeed:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
      - name: Smoke-test fixed receiver contract from final image
        run: |
          docker network create skyfeed-ci
          docker run -d --name fake-receiver --network skyfeed-ci \
            -v "$PWD/test/fixtures/readsb:/srv/data:ro" -w /srv \
            python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d python -m http.server 8080
          ready=false
          for _ in {1..10}; do
            if docker exec fake-receiver wget -q -O /dev/null http://127.0.0.1:8080/data/aircraft.json; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          printf '%s' 'synthetic.ci.token' > /tmp/skyfeed-ci-token
          docker run --rm --network skyfeed-ci \
            -v /tmp/skyfeed-ci-token:/run/secrets/discord_token:ro \
            -e SKYFEED_DISCORD_TOKEN_FILE=/run/secrets/discord_token \
            -e SKYFEED_DISCORD_APPLICATION_ID=1 \
            -e SKYFEED_DISCORD_GUILD_ID=2 \
            -e SKYFEED_ADSB_BASE_URL=http://fake-receiver:8080/data \
            skyfeed:ci source check
