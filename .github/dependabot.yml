version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
