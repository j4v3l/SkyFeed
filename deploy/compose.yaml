name: skyfeed

services:
  skyfeed:
    image: ${SKYFEED_IMAGE:-skyfeed:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SKYFEED_DISCORD_TOKEN_FILE: /run/secrets/discord_token
      SKYFEED_DISCORD_APPLICATION_ID: ${SKYFEED_DISCORD_APPLICATION_ID}
      SKYFEED_DISCORD_GUILD_ID: ${SKYFEED_DISCORD_GUILD_ID}
      SKYFEED_DISCORD_GLOBAL_COMMANDS: ${SKYFEED_DISCORD_GLOBAL_COMMANDS:-false}
      SKYFEED_DISCORD_ADMIN_ROLE_ID: ${SKYFEED_DISCORD_ADMIN_ROLE_ID:-}
      SKYFEED_DISCORD_OPERATOR_ROLE_ID: ${SKYFEED_DISCORD_OPERATOR_ROLE_ID:-}
      SKYFEED_DISCORD_MODERATOR_ROLE_ID: ${SKYFEED_DISCORD_MODERATOR_ROLE_ID:-}
      SKYFEED_ADSB_BASE_URL: ${SKYFEED_ADSB_BASE_URL}
      SKYFEED_AIRCRAFT_POLL: ${SKYFEED_AIRCRAFT_POLL:-1s}
      SKYFEED_METADATA_POLL: ${SKYFEED_METADATA_POLL:-30s}
      SKYFEED_AIRCRAFT_PROVIDER_ORDER: ${SKYFEED_AIRCRAFT_PROVIDER_ORDER:-readsb}
      SKYFEED_PUBLIC_CENTER_AIRPORT_CODE: ${SKYFEED_PUBLIC_CENTER_AIRPORT_CODE:-KPBI}
      SKYFEED_PUBLIC_CENTER_LATITUDE: ${SKYFEED_PUBLIC_CENTER_LATITUDE:-26.6832}
      SKYFEED_PUBLIC_CENTER_LONGITUDE: ${SKYFEED_PUBLIC_CENTER_LONGITUDE:--80.0956}
      SKYFEED_AIRPLANES_LIVE_RADIUS_NM: ${SKYFEED_AIRPLANES_LIVE_RADIUS_NM:-50}
      SKYFEED_AIRPLANES_LIVE_TIMEOUT: ${SKYFEED_AIRPLANES_LIVE_TIMEOUT:-2s}
      SKYFEED_AIRPLANES_LIVE_POLL: ${SKYFEED_AIRPLANES_LIVE_POLL:-1s}
      SKYFEED_DATABASE_PATH: /var/lib/skyfeed/skyfeed.db
      SKYFEED_ADSBDB_ENABLED: ${SKYFEED_ADSBDB_ENABLED:-false}
      SKYFEED_ADSBDB_ROUTE_ENABLED: ${SKYFEED_ADSBDB_ROUTE_ENABLED:-false}
      SKYFEED_ADSBDB_BASE_URL: ${SKYFEED_ADSBDB_BASE_URL:-https://api.adsbdb.com/v0}
      SKYFEED_ADSBDB_TIMEOUT: ${SKYFEED_ADSBDB_TIMEOUT:-2s}
      SKYFEED_ADSBDB_WORKERS: ${SKYFEED_ADSBDB_WORKERS:-2}
      SKYFEED_ADSBDB_AIRCRAFT_TTL: ${SKYFEED_ADSBDB_AIRCRAFT_TTL:-336h}
      SKYFEED_ADSBDB_ROUTE_TTL: ${SKYFEED_ADSBDB_ROUTE_TTL:-8h}
      SKYFEED_ADSBDB_NOT_FOUND_TTL: ${SKYFEED_ADSBDB_NOT_FOUND_TTL:-3h}
      SKYFEED_ADSBDB_ERROR_TTL: ${SKYFEED_ADSBDB_ERROR_TTL:-30s}
      SKYFEED_ADSBDB_STALE_TTL: ${SKYFEED_ADSBDB_STALE_TTL:-24h}
      SKYFEED_ADSBLOL_ENABLED: ${SKYFEED_ADSBLOL_ENABLED:-true}
      SKYFEED_ADSBLOL_BASE_URL: ${SKYFEED_ADSBLOL_BASE_URL:-https://api.adsb.lol}
      SKYFEED_ADSBLOL_TIMEOUT: ${SKYFEED_ADSBLOL_TIMEOUT:-4s}
      SKYFEED_PLANE_ALERT_ENABLED: ${SKYFEED_PLANE_ALERT_ENABLED:-true}
      SKYFEED_PLANE_ALERT_URL: ${SKYFEED_PLANE_ALERT_URL:-}
      SKYFEED_PLANE_ALERT_TIMEOUT: ${SKYFEED_PLANE_ALERT_TIMEOUT:-30s}
      SKYFEED_PLANE_ALERT_REFRESH: ${SKYFEED_PLANE_ALERT_REFRESH:-24h}
      SKYFEED_DASHBOARD_INTERVAL: ${SKYFEED_DASHBOARD_INTERVAL:-15s}
      SKYFEED_ADMIN_DIGEST_INTERVAL: ${SKYFEED_ADMIN_DIGEST_INTERVAL:-6h}
      SKYFEED_HEALTH_ADDR: 0.0.0.0:9090
      SKYFEED_PPROF_ADDR: ""
      SKYFEED_LOG_LEVEL: ${SKYFEED_LOG_LEVEL:-info}
      SKYFEED_LOG_FORMAT: ${SKYFEED_LOG_FORMAT:-json}
      SKYFEED_TIMEZONE: ${SKYFEED_TIMEZONE:-UTC}
      GOMEMLIMIT: 230MiB
    volumes:
      - skyfeed-data:/var/lib/skyfeed
      - ../secrets/discord_token:/run/secrets/discord_token:ro
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    ports:
      - 127.0.0.1:9090:9090
    healthcheck:
      test: ["CMD", "/skyfeed", "healthcheck"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  skyfeed-data:
