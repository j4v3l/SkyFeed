services:
  skyfeed:
    environment:
      SKYFEED_AGENT_ENABLED: "true"
      SKYFEED_AGENT_ADDR: 0.0.0.0:9091
      SKYFEED_AGENT_PUBLIC_URL: ${SKYFEED_AGENT_PUBLIC_URL:?Set a private HTTPS URL for agent ingress}
      SKYFEED_AGENT_MAX_FEEDERS: ${SKYFEED_AGENT_MAX_FEEDERS:-100}
      SKYFEED_AGENT_WORKERS: ${SKYFEED_AGENT_WORKERS:-4}
      SKYFEED_AGENT_QUEUE: ${SKYFEED_AGENT_QUEUE:-256}
      SKYFEED_AGENT_MAX_BODY_BYTES: ${SKYFEED_AGENT_MAX_BODY_BYTES:-3145728}
      GOMEMLIMIT: 460MiB
    ports:
      # Loopback only. Put an authenticated HTTPS reverse proxy or private mesh
      # listener in front of this port; never publish it directly on a router.
      - 127.0.0.1:9091:9091
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
